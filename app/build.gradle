
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

def releaseStoreFile = project.findProperty("KEYSTORE_FILE") ?: System.getenv("KEYSTORE_FILE") ?: "${projectDir}/keystore.jks"
def releaseStorePassword = project.findProperty("KEYSTORE_PASSWORD") ?: System.getenv("KEYSTORE_PASSWORD") ?: ""
def releaseKeyAlias = project.findProperty("KEY_ALIAS") ?: System.getenv("KEY_ALIAS") ?: "xloger"
def releaseKeyPassword = project.findProperty("KEY_PASSWORD") ?: System.getenv("KEY_PASSWORD") ?: ""
def hasReleaseSigning = file(releaseStoreFile).exists() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

repositories {
    google()
    mavenCentral()
    jcenter()
    flatDir {
        dirs 'libs'
    }
}

android {
    signingConfigs {
        config {
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
            storeFile file(releaseStoreFile)
            storePassword releaseStorePassword
        }
    }
    compileSdkVersion 26
    defaultConfig {
        applicationId "com.xloger.exlink.app"
        minSdkVersion 15
        targetSdkVersion 26
        versionCode 18
        versionName "3.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.config
            }
        }
    }
    productFlavors {
    }
    lintOptions {
        checkReleaseBuilds false
        // Or, if you prefer, you can continue to check for errors in release builds,
        // but continue the build even when errors are found:
        abortOnError false
    }

    applicationVariants.all {
        variant ->
            variant.outputs.all {
                outputFileName = "Exlink-V${defaultConfig.versionName}-${buildType.name}.apk"
            }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly fileTree(include: ['*.jar'], dir: 'deps')
    implementation 'com.android.support:appcompat-v7:26.1.0'
    implementation 'com.android.support:design:26.1.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.8.0'
    implementation(name: 'app-release', ext: 'aar')
}
